[package]
name = "bravemag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "bravemag — paced batch gateway for Browser Bridge (bbx)"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.37", features = ["derive"] }
fs2 = "0.4.3"
reqwest = { version = "0.12.22", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
